apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tryout
resources:
- ./configmap.yaml
- ./deploytryout-cm.yaml
configMapGenerator:
# generate a ConfigMap named my-system-env-<some-hash> where each key/value pair in the
# env.txt appears as a data entry (separated by \n).
- name: my-system-key
  env: out.txt
  